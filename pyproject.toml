[project]
name = "picstory"
version = "0.0.1"
description = "Photo coaching, not curation. See TAXONOMY.md."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picstory"]
